{% extends 'base.html' %}

{% block title %}Login - ELRS{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center">
                <h5 class="mb-0">Login to ELRS</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="alert alert-danger py-2">
                            Invalid username or password
                        </div>
                    {% endif %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" id="id_username"
                            required
                            oninvalid="this.setCustomValidity('Enter username')"
                            oninput="this.setCustomValidity('')">
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" id="id_password"
                            required
                            oninvalid="this.setCustomValidity('Enter password')"
                            oninput="this.setCustomValidity('')">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                    <div class="text-center mt-3">
                        <small>Don't have an account? <a href="{% url 'register' %}">Register here</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
