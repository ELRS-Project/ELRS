
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{{ page_title }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            {% if employee %}
                Update employee
            {% else %}
                Create employee
            {% endif %}
        </button>
        <a href="{% url 'employees:employee_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
